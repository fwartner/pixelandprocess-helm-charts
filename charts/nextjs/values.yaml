replicaCount: 1

image:
  repository: ghcr.io/vercel/next.js
  tag: latest
  pullPolicy: Always

imagePullSecrets: []

# Every image built via this chart's CI convention (docker/build-push-action
# with platforms: linux/amd64) is amd64-only. The cluster mixes arm64 and
# amd64 nodes, so without this pin pods land on arm64 at random and hit
# ImagePullBackOff ("no match for platform in manifest").
nodeSelector:
  kubernetes.io/arch: amd64

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  host: ""
  tlsSecretName: ""

env: []

envFrom: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

nodePort: 3000

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

persistence:
  enabled: false
  size: 1Gi
  storageClass: hcloud-volumes

database:
  enabled: false
  size: 5Gi
  name: app
  username: app
  password: ""
